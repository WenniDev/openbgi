<!doctype html>

  shell.html - the page of the WebAssembly build (emcc's shell file)

  `make wasm` turns this into bin/wasm/openbgi.html; tools/wasm/server.js
  serves it together with the game's files.  The engine draws into the
  canvas, the page shows its console output and the file cache below.

  Query parameters:
    ?args=...     the engine's command line (e.g. ?args=--engine=1.58 or ?args=--lang=ja)
    ?cache=MB     the limit of the in-memory cache of game files (default 512)
    ?fs=ws://...  another asset server than the page's own host
-->
<html lang="en" translate="no">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OpenBGI</title>
	<style>
		:root { color-scheme: dark; }
		html, body { margin: 0; background: #111; color: #ccc; font: 13px/1.4 system-ui, sans-serif; }
		#frame { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
		#canvas { display: block; background: #000; image-rendering: auto; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); outline: none; }
		#canvas.fullscreen { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: contain; max-width: none; z-index: 10; }
		#bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; width: min(100%, 960px); }
		#bar button { background: #333; color: #ddd; border: 1px solid #555; padding: 3px 10px; cursor: pointer; }
		#bar button:hover { background: #444; }
		#status { color: #9c9; }
		#log { width: min(100%, 960px); height: 160px; background: #000; color: #aaa; border: 1px solid #333; font: 12px/1.3 ui-monospace, monospace; overflow: auto; white-space: pre-wrap; padding: 4px; box-sizing: border-box; }
		#log .err { color: #e88; }
		/* the loading screen over the canvas until the game's first picture */
		#stage { position: relative; line-height: 0; }
		/* the Full screen button: the stage fills the screen, the picture keeps its aspect */
		#stage:fullscreen { background: #000; display: flex; align-items: center; justify-content: center; }
		#stage:fullscreen #canvas { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: contain; }
		#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
			padding: 24px; box-sizing: border-box; background: #000; color: #ccc; line-height: 1.5; text-align: center; transition: opacity .4s; }
		#loading.done { opacity: 0; pointer-events: none; }
		#loading[hidden] { display: none; }
		#loading.failed .spinner { display: none; }
		#loading .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #ccc; border-radius: 50%; animation: spin 1s linear infinite; }
		#loading .step { font-size: 16px; color: #eee; }
		#loading .detail { font: 12px/1.4 ui-monospace, monospace; color: #999; min-height: 1.4em; }
		#loading .hint { font-size: 12px; color: #777; max-width: 420px; }
		#loading.failed .step { color: #e88; }
		@keyframes spin { to { transform: rotate(360deg); } }
		@media (prefers-reduced-motion: reduce) { #loading .spinner { animation-duration: 3s; } }
	</style>
</head>
<body>
<div id="frame">
	<div id="stage">
		<canvas id="canvas" width="800" height="600" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
		<div id="loading" role="status" aria-live="polite">
			<div class="spinner"></div>
			<div class="step">Downloading the engine…</div>
			<div class="detail"></div>
			<div class="hint">The game's files are streamed from the server as the game needs them, so starting can take a minute or two on a slow connection.</div>
		</div>
	</div>
	<div id="bar">
		<span id="status">loading…</span>
		<span id="cache"></span>
		<button id="fullscreen" type="button">Full screen</button>
		<button id="clearlog" type="button">Clear log</button>
		<button id="exportsaves" type="button" title="Download the saves and the game's settings as a .zip">Export saves</button>
		<span>Click the picture to give it the keyboard (and to start the sound).</span>
	</div>
	<div id="log"></div>
</div>
<script>
	var query = new URLSearchParams(location.search);
	var logEl = document.getElementById('log');
	var statusEl = document.getElementById('status');
	var cacheEl = document.getElementById('cache');
	var canvas = document.getElementById('canvas');

	function log(text, err)
	{
		var line = document.createElement('div');
		if(err)
			line.className = 'err';
		line.textContent = text;
		logEl.appendChild(line);
		while(logEl.childElementCount > 500)
			logEl.removeChild(logEl.firstChild);
		logEl.scrollTop = logEl.scrollHeight;
	}

	var Module = {
		canvas: canvas,
		arguments: (query.get('args') || '').split(/\s+/).filter(function(a) { return a.length > 0; }),
		bgiCacheLimit: (parseInt(query.get('cache') || '512', 10) || 512) * 1024 * 1024,
		bgiFsUrl: query.get('fs') || null,
		print: function(text) { log(text, false); },
		printErr: function(text) { log(text, true); },
		setStatus: function(text) { if(text) statusEl.textContent = text; },
		onRuntimeInitialized: function() { statusEl.textContent = 'running'; loadingStep('Loading the game…'); },
		onFirstFrame: function() { loadingDone(); },
		onEngineEnded: function(code) { statusEl.textContent = 'the engine has ended (' + code + ')'; loadingFailed('The game has ended (' + code + ').'); },
		onCanvasResized: function(w, h, fullscreen) {
			if(!fullscreen)
			{
				canvas.style.width = '';
				canvas.style.height = '';
			}
		},
		onAbort: function(what) { statusEl.textContent = 'aborted: ' + what; log('aborted: ' + what, true); loadingFailed('The game stopped: ' + what); },
	};

	/* ---- the loading screen ----
	 * Over the canvas from the start: "Downloading the engine" until the
	 * runtime is up, then "Loading the game" with what the asset protocol
	 * has received so far (BgiNet.stats of client.js), until the engine
	 * presents its first picture that is not all black (Module.onFirstFrame,
	 * called by window.c), or reports a failure. */
	var loadingEl = document.getElementById('loading');
	var loadingTimer = setInterval(function() {
		if(typeof BgiNet === 'undefined' || !BgiNet.stats.requests)
			return;
		var mb = BgiNet.stats.bytes / 1048576;
		loadingEl.querySelector('.detail').textContent = (mb < 10 ? mb.toFixed(1) : Math.round(mb)) + ' MB received · ' + BgiNet.stats.requests + ' requests';
	}, 250);
	function loadingStep(text)
	{
		loadingEl.querySelector('.step').textContent = text;
	}
	function loadingDone()
	{
		clearInterval(loadingTimer);
		loadingEl.classList.add('done');
		setTimeout(function() { loadingEl.hidden = true; }, 500);
	}
	function loadingFailed(text)
	{
		clearInterval(loadingTimer);
		if(loadingEl.hidden || loadingEl.classList.contains('done'))
			return;
		loadingEl.classList.add('failed');
		loadingStep(text);
		loadingEl.querySelector('.hint').textContent = 'The log below the picture has the details.';
	}

	// Full screen: the stage (the canvas and the loading screen) in the browser's full screen
	var stage = document.getElementById('stage');
	document.getElementById('fullscreen').addEventListener('click', function() {
		if(stage.requestFullscreen)
			stage.requestFullscreen();
		canvas.focus();
	});
	document.getElementById('clearlog').addEventListener('click', function() { logEl.textContent = ''; });

	setInterval(function() {
		if(!Module['_openbgi_cache_stat'])
			return;
		var bytes = Module['_openbgi_cache_stat'](0), blocks = Module['_openbgi_cache_stat'](1), req = Module['_openbgi_cache_stat'](2);
		cacheEl.textContent = 'cache ' + (bytes / 1048576).toFixed(1) + ' MB in ' + blocks + ' blocks, ' + req + ' requests';
	}, 1000);

	window.addEventListener('error', function(e) { log('page error: ' + e.message, true); });

	/* ---- saves: export ----
	 * Everything the engine writes lives in the overlay, an IDBFS directory
	 * (OVERLAY) that src/os/wasm keeps in IndexedDB.  Export zips it (without
	 * the back end's own .openbgi) in the layout of the game's folder, so the
	 * files also go into a native installation. */
	var OVERLAY = '/overlay', OWN_DIR = '.openbgi';

	var crcTable = (function() {
		var t = new Uint32Array(256);
		for(var n = 0; n < 256; n++)
		{
			var c = n;
			for(var k = 0; k < 8; k++)
				c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
			t[n] = c >>> 0;
		}
		return t;
	})();
	function crc32(data)
	{
		var c = 0xffffffff;
		for(var i = 0; i < data.length; i++)
			c = crcTable[(c ^ data[i]) & 0xff] ^ (c >>> 8);
		return (c ^ 0xffffffff) >>> 0;
	}

	// the overlay's files as [relative path, Uint8Array, Date]
	function overlayFiles()
	{
		var out = [];
		(function walk(dir, rel) {
			FS.readdir(dir).forEach(function(name) {
				if(name === '.' || name === '..' || (!rel && name === OWN_DIR))
					return;
				var path = dir + '/' + name, st = FS.stat(path), r = rel ? rel + '/' + name : name;
				if(FS.isDir(st.mode))
					walk(path, r);
				else
					out.push([r, FS.readFile(path), new Date(st.mtime)]);
			});
		})(OVERLAY, '');
		return out;
	}

	// a zip of stored (uncompressed) entries, names in UTF-8
	function makeZip(files)
	{
		var enc = new TextEncoder(), parts = [], central = [], offset = 0;
		files.forEach(function(f) {
			var name = enc.encode(f[0]), data = f[1], d = f[2], crc = crc32(data);
			var time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
			var date = ((Math.max(d.getFullYear(), 1980) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
			var local = new DataView(new ArrayBuffer(30));
			local.setUint32(0, 0x04034b50, true);
			local.setUint16(4, 20, true);
			local.setUint16(6, 0x0800, true); // UTF-8 names
			local.setUint16(10, time, true);
			local.setUint16(12, date, true);
			local.setUint32(14, crc, true);
			local.setUint32(18, data.length, true);
			local.setUint32(22, data.length, true);
			local.setUint16(26, name.length, true);
			var cen = new DataView(new ArrayBuffer(46));
			cen.setUint32(0, 0x02014b50, true);
			cen.setUint16(4, 20, true);
			cen.setUint16(6, 20, true);
			cen.setUint16(8, 0x0800, true);
			cen.setUint16(12, time, true);
			cen.setUint16(14, date, true);
			cen.setUint32(16, crc, true);
			cen.setUint32(20, data.length, true);
			cen.setUint32(24, data.length, true);
			cen.setUint16(28, name.length, true);
			cen.setUint32(42, offset, true);
			parts.push(local, name, data);
			central.push(cen, name);
			offset += 30 + name.length + data.length;
		});
		var size = central.reduce(function(s, p) { return s + p.byteLength; }, 0);
		var end = new DataView(new ArrayBuffer(22));
		end.setUint32(0, 0x06054b50, true);
		end.setUint16(8, files.length, true);
		end.setUint16(10, files.length, true);
		end.setUint32(12, size, true);
		end.setUint32(16, offset, true);
		return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
	}

	document.getElementById('exportsaves').addEventListener('click', function() {
		if(typeof FS === 'undefined')
			return log('export: the engine has not started yet', true);
		var files = overlayFiles();
		if(!files.length)
			return log('export: nothing saved yet', true);
		var a = document.createElement('a'), d = new Date(), pad = function(n) { return String(n).padStart(2, '0'); };
		a.href = URL.createObjectURL(makeZip(files));
		a.download = (document.title.replace(/ - OpenBGI$/, '').replace(/[\\/:*?"<>|]/g, '_').trim() || 'openbgi') +
			' saves ' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.zip';
		document.body.appendChild(a);
		a.click();
		a.remove();
		setTimeout(function() { URL.revokeObjectURL(a.href); }, 10000);
		log('export: ' + files.length + ' files (' + files.map(function(f) { return f[0]; }).join(', ') + ')');
	});
</script>
{{{ SCRIPT }}}
</body>
</html>
